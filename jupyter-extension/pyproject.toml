[build-system]
requires = ["hatchling>=1.5.0", "hatch-jupyter-builder>=0.5", "jupyterlab>=4.0.0"]
build-backend = "hatchling.build"

[project]
name = "saasy_jupyter_odoo"
version = "0.1.0"
description = "Saasy Odoo admin menu for JupyterLab — update, logs, restart"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.10"
authors = [{ name = "Saasy", email = "esteban@saasy.fr" }]
dependencies = [
    "jupyter_server>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["saasy_jupyter_odoo"]

[tool.hatch.build.targets.wheel.shared-data]
"saasy_jupyter_odoo/labextension" = "share/jupyter/labextensions/saasy-jupyter-odoo"
"install.json" = "share/jupyter/labextensions/saasy-jupyter-odoo/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "saasy_jupyter_odoo/labextension/static/style.js",
    "saasy_jupyter_odoo/labextension/package.json",
]
skip-if-exists = ["saasy_jupyter_odoo/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[project.entry-points."jupyter_server.extension_paths"]
saasy_jupyter_odoo = "saasy_jupyter_odoo:_jupyter_server_extension_paths"
